<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111226">
<title>Chat Roulette 🎰</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111226;color:#f8f6f0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#38315c 0%,#17172c 48%,#111226 100%)}
main{max-width:760px;margin:auto;padding:35px 18px 55px}
header{text-align:center;padding:20px 0 28px}
h1{font-size:clamp(45px,10vw,82px);line-height:.94;letter-spacing:-3px;margin:18px 0;color:#ffdc7c}
header p{color:#c9c8db}.tag{display:inline-block;background:#3e375d;color:#ffe18c;padding:9px 15px;border-radius:99px;font-size:13px;font-weight:800}
.panel{border:1px solid #4b4667;border-radius:26px;padding:clamp(18px,4vw,30px);background:#23233d;box-shadow:0 20px 55px #0005}
h2{font-size:clamp(22px,4vw,28px);margin:18px 0}
button{font:inherit;font-weight:750;border:0;cursor:pointer;border-radius:15px;padding:16px;transition:background .2s,transform .2s}
button:hover:not(:disabled){transform:translateY(-1px)}button:disabled{opacity:.5;cursor:not-allowed}
.choice{width:100%;text-align:left;color:white;background:#373751;border:2px solid transparent;line-height:1.5;margin:7px 0;padding:18px}
.choice.selected{border-color:#ffdc7c;background:#4b4262}
.primary{background:#ffdc7c;color:#181526;width:100%;margin-top:14px}
.secondary{background:#41425e;color:#fff;width:100%;margin-top:12px}
.answer{background:#16172b;border:1px solid #46435e;border-radius:18px;padding:20px;margin-top:16px;line-height:1.65;white-space:pre-wrap}
.muted{color:#c3c2d6;font-size:14px;line-height:1.55}.hidden{display:none}
.status{min-height:24px;color:#ffdc7c;font-size:14px}footer{text-align:center;color:#a7a6bd;font-size:13px;margin-top:25px}
.controls{display:flex;gap:10px}.controls button{flex:1}
@media(max-width:450px){.controls{flex-direction:column}.controls button{width:100%}}
</style>
</head>
<body>
<main>
<header><span class="tag">🎙️ Inspirert av Papaya</span><h1>CHAT<br>ROULETTE 🎰</h1><p>Gjett hva ChatGPT ville svart!</p></header>
<section class="panel">
<span class="tag" id="round">RUNDE 1</span>
<h2 id="heading">Velg et spørsmål</h2>
<div id="choices"></div>
<p class="muted" id="hint">Velg ett spørsmål. Alle gjetter svaret før dere avslører det.</p>
<button class="primary" id="reveal" disabled>🎙️ Avslør svaret</button>
<p class="status" id="status" role="status" aria-live="polite"></p>
<div id="answerArea" class="hidden">
<div class="answer" id="answer"></div>
<div class="controls">
<button class="secondary" id="replay" disabled>🔊 Spill av igjen</button>
<button class="secondary" id="stop">⏹ Stopp lyd</button>
</div>
</div>
<button class="secondary" id="next">🔄 Tre nye spørsmål</button>
</section>
<footer>Ingen innlogging · Ingen poengsystem · OpenAI-stemme<br>AI-generert stemme, ikke et ekte menneske.</footer>
</main>
<script>
const $=id=>document.getElementById(id);
let round=1,selected=-1,questions=[],answer='',busy=false,requestId=0,audioUrl=null,audio=null;
function status(t){$('status').textContent=t;}
function stop(){if(audio){audio.pause();audio.currentTime=0;}}
function clearAudio(){stop();if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=null;audio=null;$('replay').disabled=true;}
async function api(endpoint,payload={}){
  const r=await fetch('/api/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  let data;try{data=await r.json()}catch{throw Error('Uventet svar fra serveren');}
  if(!r.ok)throw Error(data.error||'Noe gikk galt');return data;
}
async function loadAndPlay(index,id){
  status('🎙️ Lager norsk lyd …');
  try{
    const r=await fetch('/api/audio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index})});
    if(!r.ok){let message='Kunne ikke lage lyd';try{message=(await r.json()).error||message}catch{}throw Error(message);}
    const blob=await r.blob();
    if(id!==requestId)return;
    audioUrl=URL.createObjectURL(blob);
    audio=new Audio(audioUrl);
    $('replay').disabled=false;
    status('');
    try{await audio.play();}catch{status('Trykk «Spill av igjen» for å høre svaret.');}
  }catch(e){if(id===requestId)status('Svaret vises, men lyden feilet: '+e.message);}
}
function render(){
  clearAudio();selected=-1;answer='';
  $('round').textContent='RUNDE '+round;
  $('heading').textContent='Velg et spørsmål';
  $('choices').replaceChildren();
  $('answerArea').classList.add('hidden');$('reveal').disabled=true;
  questions.forEach((q,i)=>{
    const b=document.createElement('button');b.className='choice';b.textContent=(i+1)+'. '+q;
    b.onclick=()=>{
      if(busy)return;
      selected=i;answer='';clearAudio();
      $('answerArea').classList.add('hidden');$('reveal').disabled=false;
      $('heading').textContent='Hva tror dere ChatGPT svarer?';
      document.querySelectorAll('.choice').forEach((el,j)=>el.classList.toggle('selected',j===i));
      status('');
    };
    $('choices').append(b);
  });
}
async function next(){
  if(busy)return;
  busy=true;const id=++requestId;
  clearAudio();$('next').disabled=true;$('reveal').disabled=true;
  status('🎲 Lager tre nye spørsmål …');
  try{
    const data=await api('questions');
    if(id!==requestId)return;
    questions=data.questions;
    if($('choices').children.length)round++;
    render();status('');
  }catch(e){status(e.message);}
  finally{busy=false;$('next').disabled=false;}
}
$('reveal').onclick=async()=>{
  if(selected<0||busy)return;
  busy=true;const i=selected,id=++requestId;
  clearAudio();$('reveal').disabled=true;$('next').disabled=true;
  status('🤔 ChatGPT tenker …');
  try{
    const data=await api('answer',{index:i});
    if(id!==requestId)return;
    answer=data.answer;$('answer').textContent=answer;
    $('answerArea').classList.remove('hidden');
    // Start lydhenting umiddelbart etter at svaret er klart.
    await loadAndPlay(i,id);
  }catch(e){status(e.message);}
  finally{busy=false;$('reveal').disabled=false;$('next').disabled=false;}
};
$('next').onclick=next;
$('replay').onclick=async()=>{
  if(!audio)return;
  stop();
  try{await audio.play();status('');}catch{status('Kunne ikke starte avspilling. Prøv igjen.');}
};
$('stop').onclick=stop;
next();
</script>
</body>
</html>
